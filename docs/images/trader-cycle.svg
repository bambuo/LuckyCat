<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="cyc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="980" height="720" fill="#ffffff"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#0f172a">多智能体交易周期</text>

  <!-- ① 周期触发 -->
  <rect x="120" y="70" width="740" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="152" cy="102" r="14" fill="#3b82f6"/>
  <text x="152" y="107" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="180" y="96" font-size="14" font-weight="700" fill="#0f172a">周期触发</text>
  <text x="180" y="116" font-size="11.5" fill="#475569">启动后立即首轮；之后按扫描间隔 3–60 分钟；同一交易员同一时刻只有一个周期</text>

  <!-- ② 数据准备 -->
  <rect x="120" y="162" width="740" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="152" cy="194" r="14" fill="#0ea5e9"/>
  <text x="152" y="199" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="180" y="188" font-size="14" font-weight="700" fill="#0f172a">分析师</text>
  <text x="180" y="208" font-size="11.5" fill="#475569">候选池 · 行情/指标/情绪/新闻 → ResearchBrief；无候选则周期 skipped</text>

  <!-- ③ 提示词组装 -->
  <rect x="120" y="254" width="740" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="152" cy="286" r="14" fill="#6366f1"/>
  <text x="152" y="291" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="180" y="280" font-size="14" font-weight="700" fill="#0f172a">交易员</text>
  <text x="180" y="300" font-size="11.5" fill="#475569">简报 + 账户/持仓 + 记忆/经验 → open / close / hold；hold 直接收尾</text>

  <!-- ④ AI 决策 -->
  <rect x="120" y="346" width="740" height="64" rx="10" fill="#faf5ff" stroke="#d8b4fe"/>
  <circle cx="152" cy="378" r="14" fill="#8b5cf6"/>
  <text x="152" y="383" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="180" y="372" font-size="14" font-weight="700" fill="#0f172a">风控官（仅 open）</text>
  <text x="180" y="392" font-size="11.5" fill="#475569">检查数据与纪律，批准时只收紧仓位/杠杆/价格带；拒绝或失败 fail-closed；close 跳过</text>

  <!-- ⑤ 风控校验 -->
  <rect x="120" y="438" width="740" height="64" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <circle cx="152" cy="470" r="14" fill="#f59e0b"/>
  <text x="152" y="475" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="180" y="464" font-size="14" font-weight="700" fill="#0f172a">执行员</text>
  <text x="180" y="484" font-size="11.5" fill="#475569">place_order / close_position / cancel_order；12 步硬闸 + 账户锁；演练模拟、实盘真实提交</text>

  <!-- ⑥ 执行 -->
  <rect x="120" y="530" width="740" height="64" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <circle cx="152" cy="562" r="14" fill="#10b981"/>
  <text x="152" y="567" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="180" y="556" font-size="14" font-weight="700" fill="#0f172a">收尾（Finalizer）</text>
  <text x="180" y="576" font-size="11.5" fill="#475569">不调用模型：周期终态、阶段/工具审计、提案/裁决/订单落库，并推送 SSE</text>

  <!-- ⑦ 落库与推送 -->
  <rect x="120" y="622" width="740" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="152" cy="654" r="14" fill="#64748b"/>
  <text x="152" y="659" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  <text x="180" y="648" font-size="14" font-weight="700" fill="#0f172a">复盘（独立任务）</text>
  <text x="180" y="668" font-size="11.5" fill="#475569">定时/手动读取已平仓交易与周期 → TraderLesson；最近 3 份经验注入后续交易员</text>

  <!-- 阶段箭头 -->
  <line x1="490" y1="134" x2="490" y2="156" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#cyc-arrow)"/>
  <line x1="490" y1="226" x2="490" y2="248" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#cyc-arrow)"/>
  <line x1="490" y1="318" x2="490" y2="340" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#cyc-arrow)"/>
  <line x1="490" y1="410" x2="490" y2="432" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#cyc-arrow)"/>
  <line x1="490" y1="502" x2="490" y2="524" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#cyc-arrow)"/>
  <line x1="490" y1="594" x2="490" y2="616" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#cyc-arrow)"/>

  <!-- 回环 -->
  <path d="M 120 654 H 76 V 102 H 114" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#cyc-arrow)"/>
  <text transform="translate(60 400) rotate(-90)" text-anchor="middle" font-size="11" fill="#94a3b8">下一轮：真实持仓与经验进入下一次决策</text>
</svg>
